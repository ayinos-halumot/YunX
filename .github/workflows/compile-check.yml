# 编译检查（便宜、快速）：只编译 + 跑单测，不打包 APK。
#
# 目的：出正式包（build-release）之前先在这里验证，避免「编译错误/单测失败」把 3 分钟的打包白跑一遍。
# 手动触发，可指定分支；成功只说明「能编译、单测过」，不会产生任何可下载产物。
name: Compile Check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要检查的分支（留空 = 当前默认分支）'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YUNX_USE_MIRROR: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile (debug)
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
